name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/research_workspace?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/research_workspace_shadow?schema=public
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/research_workspace_test?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: research_workspace
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d research_workspace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm --filter @research/db exec prisma migrate deploy --config prisma.config.ts
      - run: createdb -h 127.0.0.1 -U postgres research_workspace_test
      - run: DATABASE_URL=$TEST_DATABASE_URL pnpm --filter @research/db exec prisma migrate deploy --config prisma.config.ts
      - run: pnpm check:boundaries
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
